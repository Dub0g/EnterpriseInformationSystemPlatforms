<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Послуги - Photo Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Photo Studio API</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Клієнти</a>
                <a class="nav-link active" href="services.html">Послуги</a>
                <a class="nav-link" href="orders.html">Замовлення</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Довідник послуг</h2>
            <button class="btn btn-success" onclick="openModal()">+ Додати послугу</button>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr><th>ID</th><th>Назва</th><th>Опис</th><th>Дії</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Модальне вікно -->
    <div class="modal fade" id="serviceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Послуга</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="serviceForm">
                        <input type="hidden" id="serviceId">
                        <div class="mb-2">
                            <label class="form-label">Назва послуги</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Опис</label>
                            <textarea id="description" class="form-control"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
                    <button type="button" class="btn btn-primary" onclick="saveData()">Зберегти</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const apiUrl = '/odata/Services';
        let dataList = [];
        let modal;

        document.addEventListener('DOMContentLoaded', () => {
            modal = new bootstrap.Modal(document.getElementById('serviceModal'));
            loadData();
        });

        async function loadData() {
            const res = await fetch(apiUrl);
            const data = await res.json();
            dataList = data.value;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = dataList.map(s => `
                <tr>
                    <td>${s.ID}</td><td>${s.Name}</td><td>${s.Description || ''}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="openModal(${s.ID})">Ред.</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteData(${s.ID})">Вид.</button>
                    </td>
                </tr>`).join('');
        }

        function openModal(id = null) {
            document.getElementById('serviceForm').reset();
            document.getElementById('serviceId').value = id || '';
            if (id) {
                const s = dataList.find(x => x.ID === id);
                document.getElementById('name').value = s.Name;
                document.getElementById('description').value = s.Description || '';
            }
            modal.show();
        }

        async function saveData() {
            const id = document.getElementById('serviceId').value;
            const payload = {
                Name: document.getElementById('name').value,
                Description: document.getElementById('description').value || null
            };

            if (id) {
                payload.ID = parseInt(id);
                await fetch(`${apiUrl}(${id})`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            } else {
                await fetch(apiUrl, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            }
            modal.hide(); loadData();
        }

        async function deleteData(id) {
            if (confirm('Видалити?')) { await fetch(`${apiUrl}(${id})`, { method: 'DELETE' }); loadData(); }
        }
    </script>
</body>
</html>
